        <body><!DOCTYPE html>
<html>
<head>
    <title>Henry's Password Checker</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 50px; }
        .container { background: white; padding: 20px; border-radius: 10px; width: 300px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; }
        .rules { font-size: 0.8em; color: #555; }
        .valid { color: green; font-weight: bold; }
        .invalid { color: red; }
    </style>
</head>
<body>

<div class="container">
    <h2>Login Form</h2>
    
    <label>Username:</label>
    <input type="text" placeholder="Enter name">

    <label>Password:</label>
    <input type="password" id="myPassword" onkeyup="checkPassword()" placeholder="Enter password">

    <div class="rules">
        <p id="low" class="invalid">✖ A Lowercase letter</p>
        <p id="up" class="invalid">✖ An Uppercase letter</p>
        <p id="num" class="invalid">✖ A Number</p>
        <p id="len" class="invalid">✖ Minimum 8 letters</p>
    </div>

    <button onclick="alert('Great job!')">Submit</button>
</div>

<script>
function checkPassword() {
    let pass = document.getElementById("myPassword").value;

    // 1. Check for Lowercase
    if (pass.match(/[a-z]/g)) { updateRule("low", true); } 
    else { updateRule("low", false); }

    // 2. Check for Uppercase
    if (pass.match(/[A-Z]/g)) { updateRule("up", true); } 
    else { updateRule("up", false); }

    // 3. Check for Number
    if (pass.match(/[0-9]/g)) { updateRule("num", true); } 
    else { updateRule("num", false); }

    // 4. Check for Length
    if (pass.length >= 8) { updateRule("len", true); } 
    else { updateRule("len", false); }
}

// This helper function changes the colors and icons
function updateRule(id, isValid) {
    let element = document.getElementById(id);
    if (isValid) {
        element.classList.remove("invalid");
        element.classList.add("valid");
        element.innerHTML = element.innerHTML.replace("✖", "✔");
    } else {
        element.classList.remove("valid");
        element.classList.add("invalid");
        element.innerHTML = element.innerHTML.replace("✔", "✖");
    }
}
</script>

</body>
